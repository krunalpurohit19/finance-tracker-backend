spring:
  application:
    name: finance-tracker-api

  datasource:
    # Defaults match docker-compose.yml (local dev only). Production sets all three.
    url: ${DB_URL:jdbc:mysql://localhost:3307/finance_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance_local_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    generator:
      # Money/rates are BigDecimal fields sent as JSON strings; never "1E-8".
      write-bigdecimal-as-plain: true
    parser:
      # {"amount":"1","amount":"-1"} is rejected (422), never "last one wins".
      strict-duplicate-detection: true

server:
  port: ${SERVER_PORT:4000}
  # "native" behind a reverse proxy / load balancer, so client IPs and https are seen correctly.
  forward-headers-strategy: ${FORWARD_HEADERS:none}

# --- JWT ---
app:
  jwt:
    secret: "${JWT_SECRET}"
    access-token-expiration-ms: ${JWT_ACCESS_TTL_MS:3600000}       # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_TTL_MS:2592000000}   # 30 days

# --- Logging ---
logging:
  level:
    root: INFO
    com.financetracker: DEBUG
    org.hibernate.SQL: WARN
