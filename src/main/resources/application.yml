spring:
  application:
    name: finance-tracker-api

  datasource:
    # Defaults match docker-compose.yml (local dev only). Production sets all three.
    url: ${DB_URL:jdbc:mysql://localhost:3307/finance_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance_local_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    # SMTP. Empty host = emails are logged instead of sent (local development).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

  mvc:
    format:
      date: iso   # ?from=2026-03-01 query params

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    generator:
      # Money/rates are BigDecimal fields sent as JSON strings; never "1E-8".
      write-bigdecimal-as-plain: true
    parser:
      # {"amount":"1","amount":"-1"} is rejected (422), never "last one wins".
      strict-duplicate-detection: true

server:
  port: ${SERVER_PORT:4000}
  # "native" behind a reverse proxy / load balancer, so client IPs and https are seen correctly.
  forward-headers-strategy: ${FORWARD_HEADERS:none}

# --- JWT ---
app:
  jwt:
    secret: "${JWT_SECRET}"
    access-token-expiration-ms: ${JWT_ACCESS_TTL_MS:3600000}       # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_TTL_MS:2592000000}   # 30 days

  mail:
    from: ${MAIL_FROM:Finance Tracker <no-reply@localhost>}

# --- API reference (Swagger UI) ---
springdoc:
  swagger-ui:
    path: /docs
    enabled: ${DOCS_ENABLED:true}
  api-docs:
    enabled: ${DOCS_ENABLED:true}

# --- Error reporting: disabled while the DSN is empty ---
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  send-default-pii: false

# --- Logging ---
logging:
  level:
    root: INFO
    com.financetracker: DEBUG
    org.hibernate.SQL: WARN
