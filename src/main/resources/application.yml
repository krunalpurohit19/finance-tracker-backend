spring:
  application:
    name: finance-tracker-api

  datasource:
    url: jdbc:mysql://localhost:3307/finance_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: finance
    password: finance_local_dev
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 4000

# --- JWT ---
app:
  jwt:
    secret: "${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-32-chars}"
    access-token-expiration-ms: 3600000       # 1 hour
    refresh-token-expiration-ms: 2592000000   # 30 days

# --- Logging ---
logging:
  level:
    root: INFO
    com.financetracker: DEBUG
    org.hibernate.SQL: WARN
